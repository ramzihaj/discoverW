<div class="form-container">
  <form [formGroup]="paysForm" (ngSubmit)="onSubmit()">
    <h2>Ajouter un pays</h2>

    <div class="form-group">
      <label>ID</label>
      <input type="number" formControlName="id" />
    </div>

    <div class="form-group">
      <label>Nom</label>
      <input type="text" formControlName="nom" />
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea rows="4" formControlName="description"></textarea>
    </div>

    <div class="form-group">
      <label>Continent</label>
      <input type="text" formControlName="continent" />
    </div>

    <div class="form-group">
      <label>Meilleur site touristique</label>
      <input type="text" formControlName="meilleurSiteTouristique" placeholder="Ex. Tour Eiffel, Paris" />
    </div>

    <div class="form-group">
      <label for="image">Image</label>
      <input type="file" id="image" (change)="onFileSelected($event)" accept="image/*" />
    </div>

    <div *ngIf="imagePreview">
      <p>Aperçu de l'image :</p>
      <img [src]="imagePreview" alt="Image sélectionnée" style="max-width: 200px; border-radius: 8px;" />
    </div>

    <button type="submit" [disabled]="paysForm.invalid || isLoading">
      <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
      {{ isLoading ? 'En cours...' : 'Ajouter' }}
    </button>
  </form>
</div>
