<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="card shadow-lg">
        <div class="row g-0">
          <div class="col-md-6">
            <img [src]="pays?.image" class="img-fluid rounded-start h-100 w-100" alt="{{ pays?.nom }}">
          </div>
          <div class="col-md-6">
            <div class="card-body">
              <h2 class="card-title">{{ pays?.nom }}</h2>
              <p class="card-text">{{ pays?.description }}</p>

              <hr>

              <p><strong>Continent :</strong> {{ pays?.continent }}</p>
              <p><strong>Nombre de visiteurs :</strong> {{ pays?.visiteurs | number }}</p>
              <p><strong>Langues parlées :</strong> {{ pays?.langues.join(', ') }}</p>

              <a routerLink="/" class="btn btn-primary mt-3">⬅ Retour à l'accueil</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
