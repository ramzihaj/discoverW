<!-- Carousel principal -->
<div id="carouselExample" class="carousel slide mb-5" data-bs-ride="carousel" data-bs-interval="3000">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="assets/slider1.jpg" class="d-block w-100" alt="..." height="400">
    </div>
    <div class="carousel-item">
      <img src="assets/slider2.jpg" class="d-block w-100" alt="..." height="400">
    </div>
    <div class="carousel-item">
      <img src="assets/slider3.jpg" class="d-block w-100" alt="..." height="400">
    </div>
  </div>
</div>

<!-- Deux sections parallèles -->
<div class="container">
  <div class="row">
    <!-- Partie gauche - 70% -->
    <div class="col-md-8">
      <h3>Top 3 pays visités</h3>
      <div *ngFor="let p of pays" class="card mb-3">
        <div class="row g-0">
          <div class="col-md-4">
            <img [src]="p.image" class="img-fluid rounded-start" alt="{{ p.nom }}">
          </div>
          <div class="col-md-8">
            <div class="card-body">
              <h5 class="card-title">
                <a [routerLink]="['/pays', p.id]">{{ p.nom }}</a>
              </h5>
              <p class="card-text">{{ p.description }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Partie droite - 30% -->
    <div class="col-md-4">
      <h4>Photos touristiques</h4>
      <div id="rightSlider" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
        <div class="carousel-inner">
          <div *ngFor="let img of imagesSliderDroite; let i = index" class="carousel-item" [class.active]="i === 0">
            <img [src]="img" class="d-block w-100" alt="..." height="200">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
